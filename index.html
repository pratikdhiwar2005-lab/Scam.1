<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday Lovey 😘💞</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      text-align: center;
      font-family: Arial;
      overflow: hidden;
    }

    h1 { color: pink; }

    img {
      width: 220px;
      border-radius: 15px;
      margin: 10px;
    }

    video {
      width: 300px;
      border-radius: 15px;
      margin-top: 10px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      margin: 10px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    #yes { background: pink; }

    #no {
      background: grey;
      position: absolute;
    }

    .chat {
      text-align: left;
      max-width: 300px;
      margin: auto;
      background: #111;
      padding: 10px;
      border-radius: 10px;
    }

    .msg {
      padding: 8px;
      margin: 5px;
      border-radius: 8px;
      max-width: 80%;
    }

    .me {
      background: green;
      margin-left: auto;
    }

    .her {
      background: #333;
    }

    .heart {
      position: absolute;
      color: red;
      animation: float 5s linear infinite;
    }

    @keyframes float {
      from { transform: translateY(100vh); opacity: 1; }
      to { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>

<body>

<h1>🎂 Happy Birthday Lovey 😘💞</h1>
<p>Click below for your surprise 🎁</p>

<button onclick="start()">Start 💖</button>

<script>

function start() {
  document.body.innerHTML = `

    <h1>Priyanka ❤️</h1>

    <!-- 🎵 BACKGROUND SONG -->
    <audio autoplay loop>
      <source src="song.mp3" type="audio/mpeg">
    </audio>

    <img id="slideshow" src="photo1.jpg">

    <p id="message"></p>

    <video controls>
      <source src="video.mp4" type="video/mp4">
    </video>

    <h2>Our Story 💬</h2>

    <div class="chat">
      <div class="msg her">Hi 🙂</div>
      <div class="msg me">Hello 😍</div>
      <div class="msg her">What are you doing?</div>
      <div class="msg me">Thinking about you ❤️</div>
      <div class="msg her">Pagal 😜</div>
      <div class="msg me">Only for you 💖</div>
      <div class="msg me">Today is special 🎂</div>
      <div class="msg her">Why? 🤔</div>
      <div class="msg me">Because it's your birthday Lovey 😘💞</div>
    </div>

    <p>Do you love me? 😏</p>

    <button id="yes" onclick="yesClicked()">Yes 💖</button>
    <button id="no" onmouseover="moveNo()">No 😜</button>
  `;

  typeWriter();
  startSlideshow();
}

// 💌 MESSAGE
let text = "You are my happiness, my love, my everything 💕";
let i = 0;

function typeWriter() {
  let msg = document.getElementById("message");
  function typing() {
    if (i < text.length) {
      msg.innerHTML += text.charAt(i);
      i++;
      setTimeout(typing, 50);
    }
  }
  typing();
}

// 📸 SLIDESHOW
function startSlideshow() {
  let images = ["photo1.jpg", "photo2.jpg", "photo3.jpg"];
  let index = 0;

  setInterval(() => {
    index = (index + 1) % images.length;
    document.getElementById("slideshow").src = images[index];
  }, 2000);
}

// 😏 YES
function yesClicked() {
  document.body.innerHTML = `
    <h1>I Love You Priyanka ❤️</h1>
    <p>Forever starts now 💍</p>
    <img src="photo2.jpg">
  `;
}

// 😂 RUN BUTTON
function moveNo() {
  let btn = document.getElementById("no");
  btn.style.top = Math.random() * window.innerHeight + "px";
  btn.style.left = Math.random() * window.innerWidth + "px";
}

// ❤️ HEARTS
setInterval(() => {
  let heart = document.createElement("div");
  heart.innerHTML = "❤️";
  heart.classList.add("heart");

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (10 + Math.random() * 20) + "px";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 5000);
}, 300);

</script>

</body>
</html>
